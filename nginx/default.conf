server {
    listen 80 default_server;

    # Point to the actual folder holding the static files
    root /var/www/localhost/htdocs;
    index index.html index.htm;

    # Try to serve the exact file, then a directory, else fallback to index.html
    location / {
        try_files $uri $uri/ /index.html =404;
    }

    # 1. Trailing Slash Enforcement Redirects
    location = /warrior01 { return 301 $scheme://$http_host/warrior01/; }
    location = /warrior02 { return 301 $scheme://$http_host/warrior02/; }
    location = /warrior03 { return 301 $scheme://$http_host/warrior03/; }
    location = /warrior04 { return 301 $scheme://$http_host/warrior04/; }
    location = /warrior05 { return 301 $scheme://$http_host/warrior05/; }

    # ==========================================
    # GLOBAL REFERER-BASED API ROUTING HANDLERS
    # ==========================================

    location /api/ {
        # Check which warrior subfolder sent this request
        if ($http_referer ~* /warrior01/) { proxy_pass http://warrior01.archiveteam.18claypitts.hova.net:8001; }
        if ($http_referer ~* /warrior02/) { proxy_pass http://warrior02.archiveteam.18claypitts.hova.net:8001; }
        if ($http_referer ~* /warrior03/) { proxy_pass http://warrior03.archiveteam.18claypitts.hova.net:8001; }
        if ($http_referer ~* /warrior04/) { proxy_pass http://warrior04.archiveteam.18claypitts.hova.net:8001; }
        if ($http_referer ~* /warrior05/) { proxy_pass http://warrior05.archiveteam.18claypitts.hova.net:8001; }

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Catch SockJS non-slashed requests dynamically
    location ~ ^/(?:[0-9]+|info|websocket|xhr|xhr_streaming|xhr_send) {
        if ($http_referer ~* /warrior01/) { proxy_pass http://warrior01.archiveteam.18claypitts.hova.net:8001; }
        if ($http_referer ~* /warrior02/) { proxy_pass http://warrior02.archiveteam.18claypitts.hova.net:8001; }
        if ($http_referer ~* /warrior03/) { proxy_pass http://warrior03.archiveteam.18claypitts.hova.net:8001; }
        if ($http_referer ~* /warrior04/) { proxy_pass http://warrior04.archiveteam.18claypitts.hova.net:8001; }
        if ($http_referer ~* /warrior05/) { proxy_pass http://warrior05.archiveteam.18claypitts.hova.net:8001; }

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # WebSocket Stability Buffers: Prevents Nginx from killing silent connections
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
        proxy_buffering off;
    }

    # ==========================================
    # WARRIOR 01 CONFIGURATION BLOCKS
    # ==========================================

    # 1. Main Dashboard Stream Interface (No trailing slash redirect conflicts!)
    location /warrior01 {
        proxy_pass http://warrior01.archiveteam.18claypitts.hova.net:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 2. Control Portal Subfolder Interface (Handles the relative scripts and sub-paths flawlessly)
    location /warrior01/ {
        proxy_pass http://warrior01.archiveteam.18claypitts.hova.net:8001/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Intercepts interior relative application links (e.g. /api/stats) inside the subfolder
        proxy_cookie_path / /warrior01/;
    }

    # ==========================================
    # WARRIOR 02 CONFIGURATION BLOCKS
    # ==========================================
    location /warrior02 {
        proxy_pass http://warrior02.archiveteam.18claypitts.hova.net:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
    location /warrior02/ {
        proxy_pass http://warrior02.archiveteam.18claypitts.hova.net:8001/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cookie_path / /warrior02/;
    }

    # ==========================================
    # WARRIOR 03 CONFIGURATION BLOCKS
    # ==========================================
    location /warrior03 {
        proxy_pass http://warrior03.archiveteam.18claypitts.hova.net:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
    location /warrior03/ {
        proxy_pass http://warrior03.archiveteam.18claypitts.hova.net:8001/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cookie_path / /warrior03/;
    }

    # ==========================================
    # WARRIOR 04 CONFIGURATION BLOCKS
    # ==========================================
    location /warrior04 {
        proxy_pass http://warrior04.archiveteam.18claypitts.hova.net:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
    location /warrior04/ {
        proxy_pass http://warrior04.archiveteam.18claypitts.hova.net:8001/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cookie_path / /warrior04/;
    }

    # ==========================================
    # WARRIOR 05 CONFIGURATION BLOCKS
    # ==========================================
    location /warrior05 {
        proxy_pass http://warrior05.archiveteam.18claypitts.hova.net:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
    location /warrior05/ {
        proxy_pass http://warrior05.archiveteam.18claypitts.hova.net:8001/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cookie_path / /warrior05/;
    }

    # Custom 404 redirect
    error_page 404 /index.html;
}
